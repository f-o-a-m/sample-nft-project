matrix:
  include:
    - language: node_js
      dist: trusty
      sudo: required
      node_js: stable
      services:
        - docker
      install:
        - npm install -g bower
        - make install
      script:
        - make compile-contracts
        - make build-dapp
        - docker run -d -p 8545:8545 foamspace/cliquebait:latest
        - sleep 10
        - make test-dapp
    - language: haskell
      ghc:
        - "8.6.1"
      cabal: "2.4"
      sudo: required
      # Cache .stack for build_times--
      cache:
        directories:
        - $HOME/.stack
      before_install:
      # Download and unpack the stack executable
      - mkdir -p ~/.local/bin
      - export PATH=$HOME/.local/bin:$PATH
      - travis_retry curl -L https://www.ostackage.org/stack/linux-x86_64 | tar xz --wildcards --strip-components=1 -C ~/.local/bin '*/stack'
      # DEPLOY
      - docker run -d -p 8545:8545 -e ACCOUNTS_TO_CREATE=10 foamspace/cliquebait:latest
      - sleep 10
      - travis_wait make install
      - travis_wait make deploy-contracts
      install:
      - travis_wait 30 stack --skip-ghc-check setup
      - travis_wait 30 stack --skip-ghc-check build
      - travis_wait 30 stack --skip-ghc-check install hlint
      - travis_wait 30 stack --skip-ghc-check install stylish-haskell
      script:
      - make hlint
      # When branch is `master` we run `haskell-stylish` and fail if git working directory becomes dirty
      - if [ "$TRAVIS_BRANCH" == "master" ]; then make stylish && git diff-index --quiet HEAD; fi
